[workspace]
resolver = "3"
members = ["crates/redpen-core", "crates/redpen-os", "crates/redpen-cli", "app/src-tauri"]

# One version for every crate and the app; RELEASING.md lists the other two places it appears.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MH1044/redpen"
rust-version = "1.98"

[workspace.dependencies]
redpen-core = { path = "crates/redpen-core" }
async-trait = "0.1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
# test-only
ignore = "0.4"
libtest-mimic = "0.8"
regex = "1"
tempfile = "3"
toml = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
