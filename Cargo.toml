[workspace]
resolver = "3"
members = ["crates/redpen-core", "crates/redpen-os", "crates/redpen-cli", "app/src-tauri"]

# One version for every crate and the app; RELEASING.md lists the other two places it appears.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MH1044/redpen"
rust-version = "1.98"

[workspace.dependencies]
redpen-core = { path = "crates/redpen-core" }
async-trait = "0.1"
# Pinned exactly: the module 01 goldens were recorded against Harper's own linter at this version.
harper-core = "=3.0.0"
# The production HTTP transport: rustls with the operating system's certificate store (module 02).
reqwest = "0.13"
# SQLite compiled in, so redpen.db works the same on every platform (module 02).
rusqlite = { version = "0.42", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
unicode-segmentation = "1"
# The Windows APIs behind capture: UI Automation, SendInput, the clipboard and process tokens
# (module 05). Only redpen-os uses it, and only on Windows.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
# test-only
ignore = "0.4"
libtest-mimic = "0.8"
proptest = "1"
regex = "1"
tempfile = "3"
toml = "1"
tracing-subscriber = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
