[package]
name = "redpen-app"
description = "Redpen's desktop app: the Tauri shell (tray, windows, hotkeys, commands) around redpen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# `cargo run -p redpen-app` starts the tray app; the maintainer's proof is `--bin publik-proof`.
default-run = "redpen-app"

[lib]
name = "redpen_app"
path = "src/lib.rs"

[[bin]]
name = "redpen-app"
path = "src/main.rs"

# Maintainer only: one real publik API call (scripts/publik-proof.sh, docs/modules/03-publik.md).
[[bin]]
name = "publik-proof"
path = "src/bin/publik-proof.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
async-trait = { workspace = true }
redpen-core = { workspace = true }
# Capture on Windows: reading the selection and typing the result back (module 05).
redpen-os = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
# The check shortcut (module 06).
tauri-plugin-global-shortcut = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# A fresh version 4 install id for `POST /installs` (module 03).
uuid = { workspace = true }

# Opening a publik account link in the system browser (ShellExecuteW) on Windows.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
