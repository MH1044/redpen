[package]
name = "redpen-app"
description = "Redpen's desktop app: the Tauri shell (tray, windows, hotkeys, commands) around redpen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "redpen_app"
path = "src/lib.rs"

[[bin]]
name = "redpen-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
