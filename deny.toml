# Licence gate for every Rust dependency, transitive ones included (CONTRIBUTING.md, ADR-0002).
# `cargo deny check licenses` runs in scripts/verify and in CI. It fails on anything outside the
# allow list, so GPL, AGPL, SSPL and BUSL code can never enter the build.

[graph]
# Every target the app is built for, so a dependency that only appears on one platform is still
# checked on every push. There is no macOS build (ADR-0008).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
